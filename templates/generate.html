<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章生成中</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    /* 讓 prompt 的區塊更清楚（不影響你原本 style.css） */
    .prompt-lang-tabs {
      display: flex;
      gap: 8px;
      margin: 8px 0 10px 0;
      flex-wrap: wrap;
    }
    .prompt-lang-title {
      font-weight: 600;
      font-size: 14px;
      margin: 0;
    }
    .prompt-subblock {
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 10px;
      padding: 10px;
      margin-top: 10px;
      background: rgba(255,255,255,0.6);
    }
    .prompt-content { display: none; }
    .prompt-content.active { display: block; }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      overflow-x: auto;
      margin: 10px 0 0 0;
    }
  </style>
</head>
<body class="generate-body">
  <div class="container">
    <h3>🚀 正在生成文章...</h3>
    <div id='progress-box'>
      <p><b>進度：</b><span id='progress-text'>初始化中...</span></p>
      <div class="progress-container" data-percent="0%">
        <div id='progress-bar' class="progress-bar"></div>
      </div>
      <p id='tokens-info' style="display: none; color: #666; font-size: 13px;"></p>
      <ul id='title-list'></ul>
    </div>

    <!-- 診斷信息區域 -->
    <div id="diagnostics-section" style="display: none; margin-top: 20px;">
      <h4 style="color: #dc3545;">⚠️ 診斷信息（以下關鍵字生成失敗）</h4>
      <div id="failed-keywords" style="background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px; padding: 12px; margin-bottom: 10px;">
        <ul id="failed-list" style="margin: 0; padding-left: 20px;"></ul>
      </div>
      <div id="parse-failures" style="display: none; background: #f8d7da; border: 1px solid #f5c6cb; border-radius: 8px; padding: 12px;">
        <p style="margin: 0 0 8px 0; font-weight: bold;">📋 JSON 解析失敗詳情：</p>
        <div id="parse-details"></div>
      </div>
    </div>

    <div class="buttons">
      <a href="/keywords" class="btn btn-secondary">⬅️ 返回關鍵字頁</a>
      <a href="/manage_articles" class="btn btn-primary">📊 管理資料庫</a>
    </div>

    <!-- ✅ 顯示 Prompts 區域 -->
    <div id="prompts-section" class="prompts-container" style="display: none;">
      <h3>📋 發送給 AI 的指令（Prompts）</h3>
      <div id="prompts-list"></div>
    </div>
  </div>

  <script>
    let promptsLoaded = false;

    // ✅ 指數退避輪詢
    async function pollWithBackoff(callback, maxInterval = 5000) {
      let interval = 1000;  // 初始1秒

      while (true) {
        const shouldContinue = await callback();
        if (!shouldContinue) break;

        await new Promise(resolve => setTimeout(resolve, interval));

        // 逐漸增加間隔到最大值
        interval = Math.min(interval * 1.2, maxInterval);
      }
    }

    async function updateProgress(){
      const txt = document.getElementById('progress-text');
      const bar = document.getElementById('progress-bar');
      const list = document.getElementById('title-list');
      const tokensInfo = document.getElementById('tokens-info');

      await pollWithBackoff(async () => {
        const res = await fetch('/progress');
        const data = await res.json();

        if(data.total > 0){
          const percent = Math.round((data.completed / data.total) * 100);
          const container = document.querySelector('.progress-container');
          const savedCount = (data.titles || []).length;
          txt.innerText = data.running ?
            `第 ${data.completed} / ${data.total} 篇完成` :
            `✅ 全部完成，成功儲存 ${savedCount} / ${data.total} 篇`;
          bar.style.width = percent + "%";
          container.setAttribute('data-percent', percent + "%");
          list.innerHTML = (data.titles || []).map(t => `<li>📝 ${escapeHtml(String(t))}</li>`).join('');

          // 顯示 tokens 使用量
          if (data.tokens_used && data.tokens_used > 0) {
            tokensInfo.style.display = 'block';
            tokensInfo.innerText = `📊 Tokens 使用量：${data.tokens_used.toLocaleString()}`;
          }
        }

        // ✅ 當生成完成後加載 Prompts 和診斷信息
        if(!data.running && !promptsLoaded) {
          promptsLoaded = true;
          loadPrompts();
          showDiagnostics(data);
        }

        return data.running;  // 返回是否繼續輪詢
      });
    }

    // ✅ 顯示診斷信息
    function showDiagnostics(data) {
      const failedKeywords = data.failed_keywords || [];
      const parseFailures = data.parse_failures || [];
      const errors = data.errors || [];

      if (failedKeywords.length === 0 && parseFailures.length === 0 && errors.length === 0) {
        return;  // 沒有錯誤，不顯示診斷區域
      }

      const section = document.getElementById('diagnostics-section');
      const failedList = document.getElementById('failed-list');
      const parseDetails = document.getElementById('parse-details');
      const parseSection = document.getElementById('parse-failures');

      // 顯示失敗的關鍵字
      if (failedKeywords.length > 0) {
        failedList.innerHTML = failedKeywords.map(kw =>
          `<li style="margin-bottom: 4px;">${escapeHtml(String(kw))}</li>`
        ).join('');
        section.style.display = 'block';
      }

      // 顯示 JSON 解析失敗詳情
      if (parseFailures.length > 0) {
        let html = '';
        parseFailures.forEach((failure, idx) => {
          html += `
            <div style="margin-bottom: 12px; padding: 8px; background: #fff; border-radius: 4px;">
              <p style="margin: 0 0 4px 0;"><strong>關鍵字:</strong> ${escapeHtml(String(failure.keyword || '未知'))}</p>
              <p style="margin: 0 0 4px 0;"><strong>錯誤:</strong> ${escapeHtml(String(failure.error || '未知錯誤'))}</p>
              <details>
                <summary style="cursor: pointer; color: #666;">查看原始輸出 (前 500 字)</summary>
                <pre style="background: #f8f9fa; padding: 8px; border-radius: 4px; font-size: 12px; max-height: 200px; overflow: auto;">${escapeHtml(String(failure.raw_output || ''))}</pre>
              </details>
            </div>
          `;
        });
        parseDetails.innerHTML = html;
        parseSection.style.display = 'block';
        section.style.display = 'block';
      }

      // 顯示其他錯誤
      if (errors.length > 0 && failedKeywords.length === 0) {
        failedList.innerHTML = errors.map(err =>
          `<li style="margin-bottom: 4px;">${escapeHtml(String(err))}</li>`
        ).join('');
        section.style.display = 'block';
      }
    }

    // ✅ 加載 Prompts（支援 prompt = {zh} 或舊版 prompt = "..."）
    async function loadPrompts(){
      try {
        const res = await fetch('/get_prompts');
        const data = await res.json();

        if(data.prompts && data.prompts.length > 0){
          const section = document.getElementById('prompts-section');
          const container = document.getElementById('prompts-list');

          let html = '';
          data.prompts.forEach((item, idx) => {
            const keyword = escapeHtml(String(item.keyword ?? ''));
            const index = escapeHtml(String(item.index ?? (idx + 1)));

            // 向後相容：prompt 可能是 string 或 {zh}
            let zhPrompt = '';
            if (typeof item.prompt === 'string') {
              zhPrompt = item.prompt;
            } else if (item.prompt && typeof item.prompt === 'object') {
              zhPrompt = item.prompt.zh || '';
            }

            html += `
              <div class="prompt-item">
                <h4>📌 第 ${index} 篇 - 關鍵詞：「${keyword}」</h4>

                <div class="prompt-subblock">
                  <p class="prompt-lang-title">繁體中文 Prompt</p>
                  <div class="prompt-lang-tabs">
                    <button class="toggle-btn" onclick="togglePrompt('${idx}', 'zh')">🔽 展開/收起（中文）</button>
                  </div>
                  <div id="prompt-${idx}-zh" class="prompt-content">
                    <pre>${escapeHtml(String(zhPrompt || '（無中文 Prompt）'))}</pre>
                  </div>
                </div>
              </div>
            `;
          });

          container.innerHTML = html;
          section.style.display = 'block';
        }
      } catch(e) {
        console.error('加載 Prompts 失敗:', e);
      }
    }

    // ✅ 切換顯示/隱藏（zh）
    function togglePrompt(idx, lang){
      const el = document.getElementById(`prompt-${idx}-${lang}`);
      if (!el) return;
      el.classList.toggle('active');
    }

    // ✅ HTML 轉義（防止 XSS）
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    updateProgress();
  </script>
</body>
</html>
